version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: smsc-sim
    main: ./cmd/smsc-sim
    binary: smsc-sim
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

dockers:
  - image_templates:
      - "ghcr.io/dilshodgayibnazarov/smsc-sim:{{ .Version }}"
      - "ghcr.io/dilshodgayibnazarov/smsc-sim:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--build-arg=VERSION={{ .Version }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  prerelease: auto
