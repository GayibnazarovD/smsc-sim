version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - misspell
    - revive
    - unconvert
    - gocritic

  settings:
    revive:
      rules:
        - name: exported
          disabled: false
    staticcheck:
      checks: ["all", "-ST1003"] # allow ESME_ROK-style names to mirror the SMPP spec

  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, bodyclose, gocritic]

formatters:
  enable:
    - gofmt
